<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #ffffff;
    --surface: #f5f5f5;
    --border: #e5e5e5;
    --text: #333333;
    --text-secondary: #888888;
    --accent: #18a0fb;
    --accent-hover: #0d8de8;
    --danger: #f24822;
    --radius: 6px;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-size: 11px;
    --label-size: 10px;
  }
  body {
    margin: 0;
    padding: 12px;
    font-family: var(--font);
    font-size: var(--font-size);
    color: var(--text);
    background: var(--bg);
    line-height: 1.4;
  }
  .section {
    margin-bottom: 12px;
    padding: 8px 10px;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .section-title {
    font-size: var(--label-size);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .info-box {
    font-size: var(--font-size);
    padding: 4px 0;
    word-break: break-all;
  }
  .info-box.empty {
    color: var(--text-secondary);
    font-style: italic;
  }
  .fill-badge {
    display: inline-block;
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 3px;
    font-weight: 600;
    text-transform: uppercase;
    margin-left: 4px;
  }
  .fill-badge.solid { background: #e3f2fd; color: #1565c0; }
  .fill-badge.gradient { background: #fce4ec; color: #c62828; }
  .fill-badge.none { background: #eee; color: #666; }
  label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
    font-size: var(--font-size);
    gap: 6px;
  }
  label span {
    flex-shrink: 0;
  }
  input[type="number"],
  select {
    flex: 1;
    max-width: 120px;
    height: 26px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 0 6px;
    font-size: var(--font-size);
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    box-sizing: border-box;
  }
  input[type="number"]:focus,
  select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent);
  }
  input[type="number"] {
    width: 60px;
  }
	input[type="range"] {
		flex: 1;
		max-width: 80px;
	}
	.slider-value {
		display: inline-block;
		min-width: 28px;
		text-align: right;
		font-size: var(--font-size);
		font-weight: 600;
		color: var(--text);
		flex-shrink: 0;
	}
  .row {
    display: flex;
    gap: 8px;
  }
  .row label {
    flex: 1;
  }
  .estimate {
    text-align: center;
    font-size: var(--label-size);
    color: var(--text-secondary);
    padding: 4px 0;
  }
  .estimate.high {
    color: #e65100;
    font-weight: 600;
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  button {
    flex: 1;
    height: 30px;
    border: none;
    border-radius: var(--radius);
    font-size: var(--font-size);
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font);
    transition: background 0.15s;
  }
  button.primary {
    background: var(--accent);
    color: #fff;
  }
  button.primary:hover {
    background: var(--accent-hover);
  }
  button.primary:disabled {
    background: #ccc;
    cursor: not-allowed;
  }
  button.secondary {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover {
    background: #eee;
  }
  .toggle-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }
  .toggle-label input[type="checkbox"] {
    flex: 0;
    max-width: none;
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="section">
  <div class="section-title">Boundary Shape</div>
  <div id="boundary-info" class="info-box empty">Select a shape in Figma</div>
</div>

<div class="section" id="diameter-section">
  <div class="section-title">Dot Diameter</div>
  <div id="solid-diameter">
    <label><span>Diameter</span><input id="dot-diameter" type="number" value="10" min="0.5" step="0.5"></label>
  </div>
  <div id="gradient-diameter" style="display:none">
    <label><span>Max</span><input id="max-diameter" type="number" value="20" min="0.5" step="0.5"></label>
    <label><span>Min</span><input id="min-diameter" type="number" value="2" min="0.5" step="0.5"></label>
  </div>
  <label class="toggle-label" id="bitmap-toggle-row" style="display:none;margin-top:4px">
    <span>Sample from bitmap</span>
    <input id="sample-bitmap" type="checkbox">
  </label>
</div>

<div class="section" id="color-section" style="display:none">
  <div class="section-title">Color Sampling</div>
  <label class="toggle-label">
    <span>Sample color</span>
    <input id="sample-color" type="checkbox">
  </label>
</div>

<div class="section">
  <div class="section-title">Grid Settings</div>
  <label class="toggle-label" style="margin-bottom:6px">
    <span>Concentric Circles</span>
    <input id="concentric-enabled" type="checkbox">
  </label>
  <label class="toggle-label" style="margin-bottom:6px">
    <span>Polar Curve Grid</span>
    <input id="polar-enabled" type="checkbox">
  </label>
  <label class="toggle-label" style="margin-bottom:6px">
    <span>Phyllotaxis (Sunflower)</span>
    <input id="phyllotaxis-enabled" type="checkbox">
  </label>
  <div id="grid-controls">
  <label><span>Pattern</span>
    <select id="tile-mode">
      <option value="quad">Quad Grid</option>
      <option value="hex">Hex Grid</option>
      <option value="brick">Brick Grid</option>
      <option value="diamond">Diamond Grid</option>
      <option value="random">Random</option>
    </select>
  </label>
  <label><span>Spacing</span><input id="grid-spacing" type="number" value="20" min="2" step="1"></label>
  </div>
  <div id="concentric-controls" style="display:none">
    <label><span>Ring Spacing</span>
      <select id="concentric-spacing-type">
        <option value="equal">Equal Distance</option>
        <option value="arithmetic">Arithmetic</option>
        <option value="geometric">Geometric</option>
      </select>
    </label>
    <label><span>Spacing</span><input id="concentric-spacing" type="number" value="20" min="2" step="1"></label>
    <label id="concentric-delta-row" style="display:none"><span>Delta</span><input id="concentric-delta" type="number" value="5" min="0" step="0.5"></label>
    <label id="concentric-ratio-row" style="display:none"><span>Ratio</span><input id="concentric-ratio" type="number" value="1.2" min="0.1" step="0.1"></label>
    <label><span>Phase Offset</span><input id="concentric-phase" type="range" value="0" min="0" max="360" step="1"><span class="slider-value" id="val-concentric-phase">0</span></label>
  </div>
  <div id="polar-controls" style="display:none">
    <label><span>n (skip)</span><input id="polar-skip" type="range" value="1" min="0" max="10" step="1"><span class="slider-value" id="val-polar-skip">1</span></label>
    <label><span>Curvature</span><input id="polar-n" type="range" value="1" min="-3" max="3" step="0.1"><span class="slider-value" id="val-polar-n">1</span></label>
    <label><span>Spiral</span>
      <select id="polar-spiral-type">
        <option value="archimedean">Archimedean</option>
        <option value="fermat">Fermat</option>
        <option value="logarithmic">Logarithmic</option>
        <option value="euler">Euler</option>
      </select>
    </label>
    <div style="text-align:center;font-size:10px;color:#888">R = distance to farthest boundary point</div>
  </div>
  <label><span>Rotation</span>
    <select id="rotation-mode">
      <option value="none">None</option>
      <option value="random">Random</option>
      <option value="radial">Radial</option>
      <option value="vortex">Vortex</option>
      <option value="wave-h">Wave H</option>
      <option value="wave-v">Wave V</option>
      <option value="noise">Noise Field</option>
      <option disabled>---</option>
      <option value="archimedean">Archimedean Spiral</option>
      <option value="logarithmic">Logarithmic Spiral</option>
      <option value="fermat">Fermat Spiral</option>
      <option value="euler">Euler Spiral</option>
    </select>
  </label>
  <label class="toggle-label" style="margin-top:4px">
    <span>Apply Curl</span>
    <input id="curl-enabled" type="checkbox">
  </label>
  <label id="curl-slider-row" style="display:none">
    <span>Curl Intensity</span>
    <input id="curl-intensity" type="range" value="0" min="0" max="100" step="1"><span class="slider-value" id="val-curl-intensity">0</span>
  </label>
  <div id="estimate" class="estimate"></div>
</div>

<div class="section">
  <div class="section-title">Dot Source Shape</div>
  <div id="source-info" class="info-box empty">Using default circle</div>
</div>

<div class="actions">
  <button id="generate" class="primary" disabled>Generate</button>
  <button id="cancel" class="secondary">Cancel</button>
</div>

<script>
// ---- State ----
let state = {
  boundaryNode: null,
  dotSourceNode: null,
};

// ---- DOM refs ----
const boundaryInfo = document.getElementById('boundary-info');
const sourceInfo = document.getElementById('source-info');
const solidDiameter = document.getElementById('solid-diameter');
const gradientDiameter = document.getElementById('gradient-diameter');
const dotDiameter = document.getElementById('dot-diameter');
const maxDiameter = document.getElementById('max-diameter');
const minDiameter = document.getElementById('min-diameter');
const tileMode = document.getElementById('tile-mode');
const gridSpacing = document.getElementById('grid-spacing');
const estimateEl = document.getElementById('estimate');
const generateBtn = document.getElementById('generate');
const cancelBtn = document.getElementById('cancel');
const colorSection = document.getElementById('color-section');
const sampleColor = document.getElementById('sample-color');
const sampleBitmap = document.getElementById('sample-bitmap');
const bitmapToggleRow = document.getElementById('bitmap-toggle-row');
const rotationMode = document.getElementById('rotation-mode');
const curlEnabled = document.getElementById('curl-enabled');
const curlIntensity = document.getElementById('curl-intensity');
const curlSliderRow = document.getElementById('curl-slider-row');
const concentricEnabled = document.getElementById('concentric-enabled');
const gridControls = document.getElementById('grid-controls');
const concentricControls = document.getElementById('concentric-controls');
const concentricSpacingType = document.getElementById('concentric-spacing-type');
const concentricSpacing = document.getElementById('concentric-spacing');
const concentricDeltaRow = document.getElementById('concentric-delta-row');
const concentricDelta = document.getElementById('concentric-delta');
const concentricRatioRow = document.getElementById('concentric-ratio-row');
const concentricRatio = document.getElementById('concentric-ratio');
const concentricPhase = document.getElementById('concentric-phase');
const polarEnabled = document.getElementById('polar-enabled');
const polarControls = document.getElementById('polar-controls');
const polarN = document.getElementById('polar-n');
const polarSkip = document.getElementById('polar-skip');
const polarSpiralType = document.getElementById('polar-spiral-type');
	const phyllotaxisEnabled = document.getElementById('phyllotaxis-enabled');


	// Slider value displays
	const valConcentricPhase = document.getElementById('val-concentric-phase');
	const valPolarSkip = document.getElementById('val-polar-skip');
	const valPolarN = document.getElementById('val-polar-n');
	const valCurlIntensity = document.getElementById('val-curl-intensity');
// ---- Message from plugin ----
window.addEventListener('message', (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;

  if (msg.type === 'selection-change') {
    state.boundaryNode = msg.boundaryNode;
    state.dotSourceNode = msg.dotSourceNode;
    updateUI();
  } else if (msg.type === 'sample-bitmap') {
    handleSampleBitmap(msg);
  }
});

async function handleSampleBitmap(msg) {
  const { imageBase64, scale, localPoints, sampleColor: doSampleColor } = msg;

  // Decode base64 to bytes
  const binaryStr = atob(imageBase64);
  const bytes = new Uint8Array(binaryStr.length);
  for (let i = 0; i < binaryStr.length; i++) {
    bytes[i] = binaryStr.charCodeAt(i);
  }

  // Load image from blob
  const blob = new Blob([bytes], { type: 'image/png' });
  const url = URL.createObjectURL(blob);
  const img = new Image();

  img.onload = () => {
    const canvas = document.getElementById('bitmap-canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);

    const lightness = [];
    const colors = doSampleColor ? [] : undefined;

    for (const pt of localPoints) {
      const px = Math.round(pt.x * scale);
      const py = Math.round(pt.y * scale);
      const cx = Math.max(0, Math.min(canvas.width - 1, px));
      const cy = Math.max(0, Math.min(canvas.height - 1, py));
      const pixel = ctx.getImageData(cx, cy, 1, 1).data;
      const r = pixel[0] / 255;
      const g = pixel[1] / 255;
      const b = pixel[2] / 255;
      const a = pixel[3] / 255;
      const l = (0.2126 * r + 0.7152 * g + 0.0722 * b) * a;
      lightness.push(l);
      if (colors) {
        colors.push({ r, g, b, a });
      }
    }

    parent.postMessage({ pluginMessage: { type: 'bitmap-result', lightness, colors } }, '*');
  };

  img.onerror = () => {
    URL.revokeObjectURL(url);
    parent.postMessage({ pluginMessage: { type: 'bitmap-result', lightness: localPoints.map(() => 0.5) } }, '*');
  };

  img.src = url;
}

// ---- Update UI based on state ----
function updateUI() {
  // Boundary info
  if (state.boundaryNode) {
    const b = state.boundaryNode;
    let badge = '';
    if (b.fillType === 'SOLID') badge = '<span class="fill-badge solid">Solid</span>';
    else if (b.fillType && b.fillType.startsWith('GRADIENT')) badge = '<span class="fill-badge gradient">Gradient</span>';
    else badge = '<span class="fill-badge none">No Fill</span>';

    boundaryInfo.innerHTML = `<strong>${escapeHtml(b.name)}</strong> <small>(${b.nodeType})</small>${badge}`;
    boundaryInfo.classList.remove('empty');
    generateBtn.disabled = false;
    bitmapToggleRow.style.display = 'block';

    // Show/hide diameter controls
    const isBitmap = sampleBitmap.checked;
    const isGradient = b.fillType && b.fillType.startsWith('GRADIENT');
    if (isGradient || isBitmap) {
      solidDiameter.style.display = 'none';
      gradientDiameter.style.display = 'block';
      colorSection.style.display = 'block';
    } else {
      solidDiameter.style.display = 'block';
      gradientDiameter.style.display = 'none';
      if (!isBitmap) colorSection.style.display = 'none';
    }

    // Estimate
    updateEstimate(b.bounds);
  } else {
    boundaryInfo.textContent = 'Select a shape in Figma';
    boundaryInfo.classList.add('empty');
    generateBtn.disabled = true;
    bitmapToggleRow.style.display = 'none';
    solidDiameter.style.display = 'block';
    gradientDiameter.style.display = 'none';
    colorSection.style.display = 'none';
    estimateEl.textContent = '';
  }

  // Source info
  if (state.dotSourceNode) {
    const s = state.dotSourceNode;
    sourceInfo.innerHTML = `<strong>${escapeHtml(s.name)}</strong> <small>(${s.nodeType})</small>`;
    sourceInfo.classList.remove('empty');
  } else {
    sourceInfo.textContent = 'Using default circle (select a 2nd shape to use as dot)';
    sourceInfo.classList.add('empty');
  }
}

function updateEstimate(bounds) {
  if (!bounds) {
    estimateEl.textContent = '';
    return;
  }

  let total;

  if (polarEnabled.checked) {
    total = estimatePolarPoints(bounds);
  } else if (concentricEnabled.checked) {
    total = estimateConcentricPoints(bounds);
  } else if (phyllotaxisEnabled.checked) {
    total = estimatePhyllotaxisPoints(bounds);
  } else {
    const spacing = parseFloat(gridSpacing.value) || 20;
    const mode = tileMode.value;
    let cols, rows;
    if (mode === 'hex') {
      const vSpacing = spacing * (Math.sqrt(3) / 2);
      cols = Math.ceil(bounds.width / spacing) + 1;
      rows = Math.ceil(bounds.height / vSpacing) + 1;
    } else {
      cols = Math.ceil(bounds.width / spacing) + 1;
      rows = Math.ceil(bounds.height / spacing) + 1;
    }
    total = cols * rows;
    if (mode === 'diamond') total *= 2;
  }

  estimateEl.textContent = '~' + total + ' dots (upper bound)';
  estimateEl.className = 'estimate' + (total > 5000 ? ' high' : '');
}

function estimateConcentricPoints(bounds) {
  const cx = bounds.width / 2;
  const cy = bounds.height / 2;
  const maxRadius = Math.sqrt(cx * cx + cy * cy);
  const spacing = parseFloat(concentricSpacing.value) || 20;
  const type = concentricSpacingType.value;
  const delta = parseFloat(concentricDelta.value) || 0;
  const ratio = parseFloat(concentricRatio.value) || 1;

  let total = 1; // center point
  let i = 1;
  const maxRings = 1000;

  while (i <= maxRings) {
    let r;
    if (type === 'equal') {
      r = i * spacing;
    } else if (type === 'arithmetic') {
      r = i * spacing + (i * (i - 1) / 2) * delta;
    } else {
      if (Math.abs(ratio - 1) < 1e-9) {
        r = i * spacing;
      } else {
        r = spacing * (1 - Math.pow(ratio, i)) / (1 - ratio);
      }
    }

    if (r > maxRadius || r < 0) break;

    const n = Math.max(1, Math.round(2 * Math.PI * r / spacing));
    total += n;
    i++;
  }

  return total;
}

function estimatePolarPoints(bounds) {
  const cx = bounds.width / 2;
  const cy = bounds.height / 2;
  const maxRadius = Math.sqrt(cx * cx + cy * cy);
  const densitySpacing = parseFloat(gridSpacing.value) || 20;
  const skip = parseInt(polarSkip.value) || 0;
  const curvature = parseFloat(polarN.value) || 0;
  const spiralType = polarSpiralType.value;

  const numArms = Math.max(1, Math.floor(2 * Math.PI * maxRadius / densitySpacing));
  const step = Math.max(1, skip + 1);
  const generatedArms = Math.max(1, Math.ceil(numArms / step));

  // Estimate arc length of one spiral arm via quick numerical integration
  const maxStretch = Math.max(1, Math.abs(curvature) * 2 * Math.PI);
  const oversample = Math.max(2, Math.ceil(maxStretch / 4));
  const fineSteps = Math.max(
    Math.floor(maxRadius / densitySpacing) * oversample,
    oversample * 2,
  );

  let totalArc = 0;
  let prevR = 0, prevTwist = 0;
  for (let i = 1; i <= fineSteps; i++) {
    const ri = (i / fineSteps) * maxRadius;
    const u = ri / maxRadius;
    let f;
    switch (spiralType) {
      case 'archimedean': f = u; break;
      case 'fermat': f = Math.sqrt(u); break;
      case 'logarithmic': f = u < 1e-9 ? 0 : Math.log(1 + u) / Math.log(2); break;
      case 'euler': f = u * u; break;
      default: f = u;
    }
    const twist = curvature * 2 * Math.PI * f;
    const dr = ri - prevR;
    const dTheta = twist - prevTwist;
    const rMid = (ri + prevR) / 2;
    totalArc += Math.sqrt(dr * dr + rMid * rMid * dTheta * dTheta);
    prevR = ri;
    prevTwist = twist;
  }

  const pointsPerArm = Math.ceil(totalArc / densitySpacing);
  return 1 + generatedArms * pointsPerArm;
}

function estimatePhyllotaxisPoints(bounds) {
  const cx = bounds.width / 2;
  const cy = bounds.height / 2;
  const maxRadius = Math.sqrt(cx * cx + cy * cy);
  const spacing = parseFloat(gridSpacing.value) || 20;
  return 1 + Math.floor((maxRadius / spacing) ** 2);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ---- Input change → update estimate ----
gridSpacing.addEventListener('input', () => {
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});
tileMode.addEventListener('change', () => {
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});

// ---- Generate ----
generateBtn.addEventListener('click', () => {
  if (!state.boundaryNode) return;

  const spacing = parseFloat(gridSpacing.value) || 20;
  if (spacing < 1) {
    alert('Grid spacing must be at least 1px');
    return;
  }

  const isGradient = state.boundaryNode.fillType && state.boundaryNode.fillType.startsWith('GRADIENT');

  const params = {
    dotDiameter: parseFloat(dotDiameter.value) || 10,
    maxDiameter: parseFloat(maxDiameter.value) || 20,
    minDiameter: parseFloat(minDiameter.value) || 2,
    gridSpacing: spacing,
    tileMode: tileMode.value,
    dotSourceNodeId: state.dotSourceNode ? state.dotSourceNode.id : null,
    boundaryNodeId: state.boundaryNode.id,
    sampleColor: sampleColor.checked,
    sampleBitmap: sampleBitmap.checked,
    rotationMode: rotationMode.value,
    curlEnabled: curlEnabled.checked,
    curlIntensity: parseInt(curlIntensity.value) || 0,
    concentricEnabled: concentricEnabled.checked,
    concentricSpacingType: concentricSpacingType.value,
    concentricSpacing: parseFloat(concentricSpacing.value) || 20,
    concentricDelta: parseFloat(concentricDelta.value) || 0,
    concentricRatio: parseFloat(concentricRatio.value) || 1,
    concentricPhaseOffset: parseInt(concentricPhase.value) || 0,
    polarEnabled: polarEnabled.checked,
    polarN: parseFloat(polarN.value) || 0,
    polarSkip: parseInt(polarSkip.value) || 0,
    polarSpiralType: polarSpiralType.value,
    phyllotaxisEnabled: phyllotaxisEnabled.checked,
  };

  parent.postMessage({ pluginMessage: { type: 'generate-dots', ...params } }, '*');
});

// ---- Cancel ----
cancelBtn.addEventListener('click', () => {
  parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
});

// ---- Curl toggle → show/hide slider ----
curlEnabled.addEventListener('change', () => {
  curlSliderRow.style.display = curlEnabled.checked ? 'flex' : 'none';
});

// ---- Concentric toggle → show/hide grid vs concentric controls ----
concentricEnabled.addEventListener('change', () => {
  const on = concentricEnabled.checked;
  if (on && polarEnabled.checked) {
    polarEnabled.checked = false;
    polarControls.style.display = 'none';
  }
  if (on && phyllotaxisEnabled.checked) {
    phyllotaxisEnabled.checked = false;
  }
  // phyllotaxis uses the same spacing control, so keep gridControls visible
  gridControls.style.display = on || polarEnabled.checked ? 'none' : 'block';
  concentricControls.style.display = on ? 'block' : 'none';
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});

// ---- Polar toggle → show/hide grid vs polar controls ----
polarEnabled.addEventListener('change', () => {
  const on = polarEnabled.checked;
  if (on && concentricEnabled.checked) {
    concentricEnabled.checked = false;
    concentricControls.style.display = 'none';
  }
  if (on && phyllotaxisEnabled.checked) {
    phyllotaxisEnabled.checked = false;
  }
  gridControls.style.display = on || concentricEnabled.checked ? 'none' : 'block';
  polarControls.style.display = on ? 'block' : 'none';
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});

// ---- Phyllotaxis toggle → show/hide grid controls ----
phyllotaxisEnabled.addEventListener('change', () => {
  const on = phyllotaxisEnabled.checked;
  if (on && concentricEnabled.checked) {
    concentricEnabled.checked = false;
    concentricControls.style.display = 'none';
  }
  if (on && polarEnabled.checked) {
    polarEnabled.checked = false;
    polarControls.style.display = 'none';
  }
  // Phyllotaxis keeps the spacing control visible; only hide concentric/polar controls
  gridControls.style.display = concentricEnabled.checked || polarEnabled.checked ? 'none' : 'block';
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});

// ---- Concentric spacing type → show/hide delta/ratio ----
concentricSpacingType.addEventListener('change', () => {
  const type = concentricSpacingType.value;
  concentricDeltaRow.style.display = type === 'arithmetic' ? 'flex' : 'none';
  concentricRatioRow.style.display = type === 'geometric' ? 'flex' : 'none';
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});

// ---- Concentric param changes → update estimate ----
concentricSpacing.addEventListener('input', () => {
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});
concentricDelta.addEventListener('input', () => {
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});
concentricRatio.addEventListener('input', () => {
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});

// ---- Polar param changes → update estimate (slider sync handled above) ----
polarSpiralType.addEventListener('change', () => {
  if (state.boundaryNode && state.boundaryNode.bounds) {
    updateEstimate(state.boundaryNode.bounds);
  }
});

// ---- Bitmap toggle → refresh UI ----
sampleBitmap.addEventListener('change', () => {
  if (state.boundaryNode) updateUI();
});


	// ---- Slider value sync ----
	function syncSlider(slider, display, decimals) {
		const v = parseFloat(slider.value);
		display.textContent = v.toFixed(decimals);
	}
	syncSlider(concentricPhase, valConcentricPhase, 0);
	syncSlider(polarSkip, valPolarSkip, 0);
	syncSlider(polarN, valPolarN, 1);
	syncSlider(curlIntensity, valCurlIntensity, 0);
	concentricPhase.addEventListener('input', function() {
		syncSlider(concentricPhase, valConcentricPhase, 0);
		if (state.boundaryNode && state.boundaryNode.bounds) updateEstimate(state.boundaryNode.bounds);
	});
	polarSkip.addEventListener('input', function() {
		syncSlider(polarSkip, valPolarSkip, 0);
		if (state.boundaryNode && state.boundaryNode.bounds) updateEstimate(state.boundaryNode.bounds);
	});
	polarN.addEventListener('input', function() {
		syncSlider(polarN, valPolarN, 1);
		if (state.boundaryNode && state.boundaryNode.bounds) updateEstimate(state.boundaryNode.bounds);
	});
	curlIntensity.addEventListener('input', function() {
		syncSlider(curlIntensity, valCurlIntensity, 0);
	});
// ---- Request initial state ----
parent.postMessage({ pluginMessage: { type: 'request-selection' } }, '*');
